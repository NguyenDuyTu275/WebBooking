# Emails
mail.registerOtp.subject=Confirm your account - Booking Nhom 2
mail.registerOtp.body=Your sign-up OTP code is: {0}\n\nThe code is valid for {1} minutes. If you did not sign up, please ignore this email.
mail.emailChangeOtp.subject=Confirm your new email - Booking Nhom 2
mail.emailChangeOtp.body=Hello {0},\n\nYour OTP code to confirm your new email is: {1}\nThe code is valid for {2} minutes.\n\nIf you did not ask to change your email, please ignore this email.
mail.passwordResetOtp.subject=Reset your password - Booking Nhom 2
mail.passwordResetOtp.body=Hello {0},\n\nYour OTP code to reset your password is: {1}\nThe code is valid for {2} minutes.\n\nIf you did not ask to reset your password, please ignore this email.
mail.passwordChanged.subject=Your password was changed - Booking Nhom 2
mail.passwordChanged.body=Hello {0},\n\nYour password has been changed.\nIf you did not make this change, please contact support immediately.
mail.loginNotice.subject=New sign-in
mail.loginNotice.body=Hello {0}, you have just signed in.
mail.googleLoginNotice.subject=New sign-in with Google
mail.googleLoginNotice.body=Hello {0}, you have just signed in with Google.
mail.invoice.subject=Booking confirmation #{1}
mail.invoice.body=Hello {0},\n\nWe have received the payment for booking #{1} at {2}.\nThe detailed invoice is attached to this email.\n\nThank you for booking with us!

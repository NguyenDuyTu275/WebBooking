spring.application.name=backendcuoiky
server.port=${PORT:8080}

# Doc mat khau / secret tu file .env o thu muc goc (neu co).
# Tren Render/Railway/CI khong co file .env -> lay tu bien moi truong.
# KHONG ghi gia tri that vao file nay (file duoc commit len GitHub).
spring.config.import=optional:file:.env[.properties]

# Database - Session Pooler (5432), khong dung Transaction Pooler (6543) vi Hibernate can session lau dai
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.madpcgneaunzuwvkugtu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000

# Schema do Flyway quan ly (src/main/resources/db/migration). "validate" khi schema da on dinh.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Supabase Storage - luu anh upload (thieu SUPABASE_KEY -> luu vao thu muc uploads/, mat khi deploy lai)
supabase.url=${SUPABASE_URL:https://madpcgneaunzuwvkugtu.supabase.co}
supabase.key=${SUPABASE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:images}

# Anh upload toi da 5 MB (bang gioi han cua bucket); mac dinh Spring chi cho 1 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Mail (Gmail SMTP voi App Password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Payment QR - TPBank via VietQR
payment.bank.name=${PAYMENT_BANK_NAME:TPBank}
payment.bank.account-number=${PAYMENT_BANK_ACCOUNT_NUMBER:10001473192}
payment.bank.account-name=${PAYMENT_BANK_ACCOUNT_NAME:NGUYEN DUY TU}
payment.qr.template=compact2

# Bat buoc: webhook Sepay tu choi moi request khi gia tri nay trong
payment.sepay.api-key=${SEPAY_API_KEY:}

# JWT - khoa ky token dang nhap (it nhat 32 ky tu; thieu -> khoa ngau nhien moi lan khoi dong)
jwt.secret=${JWT_SECRET:}

# Google OAuth2 Login
google.client-id=${GOOGLE_CLIENT_ID:629111799618-99e15l0prujq2bqif30mtfr6eevlqk7s.apps.googleusercontent.com}

# Gemini: đọc hóa đơn admin quét bằng máy ảnh. Thiếu khóa thì đọc dòng GEMINI_API_KEY trong bảng app_config.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-flash-latest}
